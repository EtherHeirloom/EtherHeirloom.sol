[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 500
via_ir = false
evm_version = "cancun"
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 500
fail_on_revert = false

# Used by CI: many more random inputs and action sequences
[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 500
depth = 500
fail_on_revert = false
